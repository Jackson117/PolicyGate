[project]
name = "policygate"
version = "0.2.0"
description = "Reliability and audit harness for policy-following trading agents, evaluated on tau2-bench"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # harness/ may import pydantic, deepdiff and the stdlib -- nothing else, and
    # no agent framework. deepdiff is declared here rather than inherited from
    # tau2 (which lives in the `bench` extra) so that harness/ imports cleanly
    # with the benchmark absent.
    "deepdiff>=8.4.2",
    "pydantic>=2.9",
    # Below this line: for adapters/, eval/, store/, service/ and viz/ only.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# tau2-bench pulls in litellm, tenacity, fastapi, loguru, deepdiff, pandas,
# pytest-xdist and plotly. Do not re-declare those here.
bench = [
    "tau2[knowledge,experiments]",
]
store = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]
service = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "uvicorn>=0.30",
]
viz = [
    "streamlit>=1.38",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policygate"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Two kinds of script are kept as written rather than maintained, so they are
# not linted: the *_learn_* files are modules rewritten from memory before
# reading the real one (reformatting them would edit the evidence), and the w1_*
# files are the one-off analysis scripts that produced the W1 numbers, since
# superseded by src/policygate/eval/. Everything still in use is linted.
extend-exclude = ["scripts/*_learn_*.py", "scripts/w1_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
