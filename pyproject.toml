[project]
name = "policygate"
version = "0.1.0"
description = "Reliability and audit harness for policy-following trading agents, evaluated on tau2-bench"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # harness/ depends on pydantic + stdlib ONLY. Everything below this line
    # is for adapters/, eval/, store/, service/ and viz/ -- never for harness/.
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# tau2-bench pulls in litellm, tenacity, fastapi, loguru, deepdiff, pandas,
# pytest-xdist and plotly. Do not re-declare those here.
bench = [
    "tau2[knowledge,experiments]",
]
store = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]
service = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "uvicorn>=0.30",
]
viz = [
    "streamlit>=1.38",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policygate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
